<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetView — Freight Command</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">

  <!-- ===== Header ===== -->
  <header>
    <div class="logo">
      <span class="mark">▣</span>
      <div>FleetView <small>Freight Command · SupplyNow</small></div>
    </div>
    <button class="btn ghost" id="btn-filters" style="display:none">☰ Filters</button>
    <div class="spacer"></div>
    <div class="src-toggles" id="src-toggles"></div>
    <div style="display:flex;gap:6px">
      <a class="btn ghost" href="opportunities.html">Opportunities</a>
      <a class="btn ghost" href="prospects.html">Prospects</a>
      <a class="btn ghost" href="brokers.html">Brokers</a>
    </div>
    <span id="vm-host"></span>
    <span class="mode-badge mock" id="mode-badge">● Sample data</span>
    <button class="btn primary" id="btn-refresh">↻ Refresh</button>
  </header>

  <div class="grid">
    <!-- ===== Filter rail ===== -->
    <aside class="filters" id="filters">
      <div class="fgroup">
        <h3>Origin</h3>
        <div class="field"><label>City</label><input id="f-origin-city" placeholder="e.g. Cleveland"></div>
        <div class="row2">
          <div class="field"><label>State</label><input id="f-origin-state" maxlength="2" placeholder="OH"></div>
          <div class="field"><label>Radius (mi)</label><input id="f-origin-radius" type="number" placeholder="150"></div>
        </div>
      </div>
      <div class="fgroup">
        <h3>Destination</h3>
        <div class="field"><label>City</label><input id="f-dest-city" placeholder="e.g. Chicago"></div>
        <div class="row2">
          <div class="field"><label>State</label><input id="f-dest-state" maxlength="2" placeholder="IL"></div>
          <div class="field"><label>Radius (mi)</label><input id="f-dest-radius" type="number" placeholder="150"></div>
        </div>
      </div>
      <div class="fgroup">
        <h3>Equipment & Load</h3>
        <div class="field"><label>Equipment</label>
          <select id="f-equipment">
            <option value="">Any</option>
            <option value="V">Van (Dry)</option>
            <option value="R">Reefer</option>
            <option value="F">Flatbed</option>
            <option value="SD">Step Deck</option>
            <option value="HS">Hotshot</option>
            <option value="PO">Power Only</option>
            <option value="CV">Cargo Van</option>
            <option value="BOX">Box Truck</option>
            <option value="RGN">RGN / Lowboy</option>
          </select>
        </div>
        <div class="row2">
          <div class="field"><label>Min weight (lb)</label><input id="f-min-weight" type="number" placeholder="0"></div>
          <div class="field"><label>Max weight (lb)</label><input id="f-max-weight" type="number" placeholder="45000"></div>
        </div>
        <div class="field"><label>Max trip miles</label><input id="f-max-miles" type="number" placeholder="600"></div>
      </div>
      <div class="fgroup">
        <h3>Rate & Freshness</h3>
        <div class="row2">
          <div class="field"><label>Min rate ($)</label><input id="f-min-rate" type="number" placeholder="500"></div>
          <div class="field"><label>Max rate ($)</label><input id="f-max-rate" type="number" placeholder=""></div>
        </div>
        <div class="row2">
          <div class="field"><label>Min $/mile</label><input id="f-min-rpm" type="number" step="0.01" placeholder="1.69"></div>
          <div class="field"><label>Max age (hrs)</label><input id="f-max-age" type="number" placeholder="6"></div>
        </div>
        <div class="chkrow"><input type="checkbox" id="f-full-only"><label for="f-full-only" style="margin:0">Full loads only</label></div>
        <div class="chkrow"><input type="checkbox" id="f-hide-call"><label for="f-hide-call" style="margin:0">Hide "call for rate"</label></div>
      </div>
      <div class="filter-actions">
        <button class="btn primary" id="btn-search">Search</button>
        <button class="btn" id="btn-clear">Clear</button>
      </div>
      <div class="fgroup" style="margin-top:20px">
        <h3>Saved searches / alerts</h3>
        <button class="btn ghost" id="btn-save" style="width:100%;justify-content:center;margin-bottom:8px">★ Save current search</button>
        <div class="saved-list" id="saved-list"></div>
      </div>
    </aside>

    <!-- ===== Main ===== -->
    <section class="main">
      <div class="toolbar">
        <div class="count"><span id="count-num">0</span> loads</div>
        <span class="muted" id="delay-note"></span>
        <div class="spacer" style="flex:1"></div>
        <select class="sort-select" id="sort-select" title="Sort">
          <option value="ageMins:asc">Newest first</option>
          <option value="rpm:desc">Best $/mile</option>
          <option value="rate:desc">Highest rate</option>
          <option value="miles:asc">Shortest miles</option>
          <option value="miles:desc">Longest miles</option>
        </select>
        <div class="view-toggle">
          <button data-view="table" class="on">Table</button>
          <button data-view="split">Split</button>
          <button data-view="map">Map</button>
        </div>
      </div>

      <div class="content" id="content">
        <div class="tablewrap">
          <table>
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="map"></div>

        <!-- Detail drawer -->
        <div class="drawer" id="drawer">
          <header>
            <div><div style="font-size:11px;letter-spacing:1px;color:var(--txt-3);text-transform:uppercase">Load detail</div></div>
            <button class="close" id="drawer-close">×</button>
          </header>
          <div class="body" id="drawer-body"></div>
          <div class="drawer-actions">
            <button class="btn primary" id="drawer-quote" data-id="">Generate quote</button>
            <button class="btn" id="drawer-bid" data-id="">Bid / contact</button>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- Quote / Bid modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mhead"><h2>Quote & Bid</h2><button class="close" id="overlay-close">×</button></div>
    <div class="mbody" id="quote-body"></div>
    <div style="display:flex;gap:8px;padding:16px 20px;border-top:1px solid var(--line)">
      <button class="btn" id="quote-copy" style="flex:1;justify-content:center">Copy quote</button>
      <button class="btn primary" id="quote-send" style="flex:1;justify-content:center">Send bid to broker →</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/viewmode.js"></script>
<script src="js/schema.js"></script>
<script src="js/connectors.js"></script>
<script src="js/app.js"></script>
</body>
</html>
