<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetView — Opportunity Pipeline</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/opps.css">
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><span class="mark">◎</span>
      <div>FleetView <small>Opportunity Pipeline · SupplyNow</small></div></div>
    <div class="spacer"></div>
    <div style="display:flex;gap:6px">
      <a class="btn ghost" href="index.html">Load Board</a>
      <a class="btn ghost" href="opportunities.html" style="background:var(--brand);border-color:var(--brand);color:var(--brand-ink)">Opportunities</a>
      <a class="btn ghost" href="prospects.html">Prospects</a>
    </div>
    <span class="mode-badge mock" id="mode-badge">● Sample data</span>
    <button class="btn primary" id="btn-refresh">↻ Refresh</button>
  </header>

  <div class="grid">
    <aside class="filters" id="filters">
      <div class="fgroup">
        <h3>Search</h3>
        <div class="field"><label>Keyword</label><input id="f-keyword" placeholder="reefer, food, LTL…"></div>
        <div class="field"><label>NAICS group</label>
          <select id="f-naics"><option value="">Any freight NAICS</option>
            <option value="trucking">Trucking (484)</option>
            <option value="courier">Courier / Delivery (492)</option>
            <option value="warehouse">Warehousing (493)</option>
          </select></div>
        <div class="field"><label>State (place of performance)</label><input id="f-state" maxlength="2" placeholder="OH"></div>
        <div class="field"><label>Notice type</label>
          <select id="f-type"><option value="">Any</option>
            <option>Solicitation</option><option>Presolicitation</option>
            <option>Combined Synopsis/Solicitation</option><option>Sources Sought</option>
            <option>Special Notice</option><option>Award Notice</option>
          </select></div>
      </div>
      <div class="fgroup">
        <h3>Qualify</h3>
        <div class="field"><label>Due within (days)</label><input id="f-due-within" type="number" placeholder="30"></div>
        <div class="field"><label>Min est. value ($)</label><input id="f-min-value" type="number" placeholder="50000"></div>
        <div class="field"><label>Min worth-it score</label><input id="f-min-score" type="number" placeholder="55"></div>
        <div class="chkrow"><input type="checkbox" id="f-hide-passed" checked><label for="f-hide-passed" style="margin:0">Hide passed deadlines</label></div>
      </div>
      <div class="filter-actions">
        <button class="btn primary" id="btn-search">Search</button>
        <button class="btn" id="btn-clear">Clear</button>
      </div>
      <div class="fgroup" style="margin-top:18px">
        <h3>Sources</h3>
        <div class="src-chip" data-on="true" style="width:100%"><span class="dot" style="background:#3fb950"></span>SAM.gov · Federal</div>
        <div class="muted" style="font-size:11.5px;margin-top:8px">State/institutional RFP + direct-shipper prospecting are next layers.</div>
      </div>
    </aside>

    <section class="main">
      <div class="toolbar">
        <div class="count"><span id="count-num">0</span> opportunities</div>
        <div class="pipe-strip" id="pipe-strip"></div>
        <div class="spacer" style="flex:1"></div>
        <select class="sort-select" id="sort-select">
          <option value="worthScore:desc">Best score</option>
          <option value="dueDate:asc">Closing soonest</option>
          <option value="value:desc">Highest value</option>
        </select>
        <div class="view-toggle">
          <button data-view="table" class="on">Table</button>
          <button data-view="board">Pipeline</button>
        </div>
      </div>

      <div class="content" id="content">
        <div class="tablewrap">
          <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
        </div>
        <div class="drawer" id="drawer">
          <header><div><div style="font-size:11px;letter-spacing:1px;color:var(--txt-3);text-transform:uppercase">Opportunity</div></div>
            <button class="close" id="drawer-close">×</button></header>
          <div class="body" id="drawer-body"></div>
        </div>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="js/opps-data.js"></script>
<script src="js/opps-app.js"></script>
</body>
</html>
